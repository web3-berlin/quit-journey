name: Android release

# Builds a signed Play Store bundle (AAB). Push a tag like `android-v1.0.0`, or run it manually.
on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name shown in the store (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      track:
        description: "Play track to upload to (needs PLAY_SERVICE_ACCOUNT_JSON); leave empty to only build"
        required: false
        default: "internal"

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      # Play requires a strictly increasing versionCode for every upload.
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ github.event.inputs.version_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix mobile --no-audit --no-fund

      - name: Check types and tests
        run: |
          npm run tsc
          npm test
          npm run typecheck --prefix mobile

      - name: Decode upload key
        env:
          QJ_KEYSTORE_BASE64: ${{ secrets.QJ_KEYSTORE_BASE64 }}
        run: |
          test -n "$QJ_KEYSTORE_BASE64" || { echo "::error::Secret QJ_KEYSTORE_BASE64 is missing (see mobile/README.md)"; exit 1; }
          echo "$QJ_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "QJ_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed bundle
        working-directory: mobile
        env:
          QJ_KEYSTORE_PASSWORD: ${{ secrets.QJ_KEYSTORE_PASSWORD }}
          QJ_KEY_ALIAS: ${{ secrets.QJ_KEY_ALIAS }}
          QJ_KEY_PASSWORD: ${{ secrets.QJ_KEY_PASSWORD }}
        run: |
          VERSION_NAME="${VERSION_NAME#android-v}"
          export VERSION_NAME
          npm run aab:release

      - uses: actions/upload-artifact@v4
        with:
          name: quit-journey-${{ env.VERSION_CODE }}.aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload to Google Play
        if: ${{ github.event.inputs.track != '' && env.PLAY_JSON != '' }}
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.w3b.health.quitjourney
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: draft
